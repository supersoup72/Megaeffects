name: Build Mega Effects APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build libtcc.so for Android ARM64
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -1)
          echo "Using NDK: $NDK"
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot

          git clone --depth=1 https://github.com/TinyCC/tinycc /tmp/tinycc
          cd /tmp/tinycc

          echo "=== TCC source files ==="
          ls -la *.c | head -20

          python3 $GITHUB_WORKSPACE/scripts/gen_tccdefs.py include/tccdefs.h tccdefs_.h
          echo "tccdefs_.h: $(wc -c < tccdefs_.h) bytes"

          printf '#define CONFIG_TCCDIR ""\n#define CONFIG_TCC_SYSINCLUDEPATHS "/data/data/com.termux/files/usr/include"\n#define CONFIG_TCC_LIBPATHS "/data/data/com.termux/files/usr/lib"\n#define CONFIG_TCC_CRTPREFIX "/data/data/com.termux/files/usr/lib"\n#define CONFIG_TCC_ELFINTERP "/system/bin/linker64"\n#define CONFIG_VERSION "0.9.27"\n#define TCC_VERSION "0.9.27"\n#define GCC_MAJOR 12\n#define GCC_MINOR 0\n#define TCC_TARGET_ARM64 1\n#define ONE_SOURCE 1\n' > config.h

          SRC=tcc.c
          [ -f libtcc.c ] && SRC=libtcc.c
          echo "Using source: $SRC"

          $CC -DONE_SOURCE=1 -DLIBTCC=1 -shared -fPIC \
            --sysroot=$SYSROOT \
            -o libtcc.so $SRC -lm 2>&1

          echo "=== Build result ==="
          ls -la libtcc.so 2>/dev/null || echo "libtcc.so NOT built"

          if [ -s libtcc.so ]; then
            file libtcc.so
            mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
            cp libtcc.so $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libtcc.so
            echo "SUCCESS: libtcc.so bundled ($(wc -c < libtcc.so) bytes)"
          else
            echo "FAILED: trying verbose output"
            $CC -DONE_SOURCE=1 -DLIBTCC=1 -shared -fPIC \
              --sysroot=$SYSROOT -o libtcc2.so $SRC -lm -v 2>&1 | tail -40
            exit 1
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mega-effects-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
