name: Build Mega Effects APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build libtcc.so for Android ARM64
        run: |
          # Find whatever NDK version is installed
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -1)
          echo "Using NDK: $NDK"
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          AR=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          SYSROOT=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot

          echo "=== Clone TinyCC ==="
          git clone --depth=1 https://github.com/TinyCC/tinycc /tmp/tinycc
          cd /tmp/tinycc

          echo "=== Generate tccdefs_.h ==="
          python3 $GITHUB_WORKSPACE/scripts/gen_tccdefs.py include/tccdefs.h tccdefs_.h
          echo "tccdefs_.h: $(wc -c < tccdefs_.h) bytes"

          echo "=== Generate config.h ==="
          printf '%s\n' \
            '#define CONFIG_TCCDIR ""' \
            '#define CONFIG_TCC_SYSINCLUDEPATHS "/data/data/com.termux/files/usr/include"' \
            '#define CONFIG_TCC_LIBPATHS "/data/data/com.termux/files/usr/lib"' \
            '#define CONFIG_TCC_CRTPREFIX "/data/data/com.termux/files/usr/lib"' \
            '#define CONFIG_TCC_ELFINTERP "/system/bin/linker64"' \
            '#define CONFIG_VERSION "0.9.27"' \
            '#define TCC_VERSION "0.9.27"' \
            '#define GCC_MAJOR 12' \
            '#define GCC_MINOR 0' \
            '#define TCC_TARGET_ARM64 1' \
            '#define ONE_SOURCE 1' \
            > config.h

          echo "=== Build libtcc.so ==="
          $CC \
            -DONE_SOURCE=1 \
            -DLIBTCC \
            -shared -fPIC \
            --sysroot=$SYSROOT \
            -o libtcc.so \
            libtcc.c -lm 2>&1

          if [ -s libtcc.so ]; then
            echo "libtcc.so: $(wc -c < libtcc.so) bytes"
            file libtcc.so
            mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a
            cp libtcc.so $GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libtcc.so
            echo "libtcc.so bundled in jniLibs!"
          else
            echo "WARNING: libtcc.so build failed"
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Xmx4g"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mega-effects-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
